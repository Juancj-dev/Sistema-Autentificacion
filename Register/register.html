<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div>
        <div class="content-form">
            <form action="" class="form">
                <h1 class="title-form">REGISTER</h1>
                <input type="text" name="Usuario" class="content-form-u" id="inp-user" placeholder="Usuario" autocomplete="none">
                <p class="content-form-msj" id="msj-user">por ejemplo: juan</p>
                <input type="Email" name="Email" class="content-form-m" id="inp-mail" placeholder="Email">
                <p class="content-form-msj" id="msj-mail">por ejemplo: juan@gmail.com</p>
                <input type="password" name="Password" class="content-form-p" id="inp-pass" placeholder="password" autocomplete="none">
                <p class="content-form-msj" id="msj-pass">por ejemplo: juan123</p>
                <button class="content-btn-register" id="btn-register">Register</button>
                <a class="content-enlace" href="../Login/login.html">Login</a>
            </form>
        </div>
    </div>
    <script src="codigo.js"></script>
</body>

</html>
